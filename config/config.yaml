# A minimal example of how to configure this module

# electrolyser parameters specification
electrolyser_energy: 58  # kWhe/kg H2
electrolyser_CAPEX: 2075  # EUR/kW
electrolyser_FOM: 0.025
electrolyser_lifetime: 20
# discount rate for calculation
discount_rate: 0.08
util_rate: 0.6

overrides:
  NAM:
    discount_rate: 0.12
  DEU:
    electrolyser_CAPEX: 2000